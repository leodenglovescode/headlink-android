name: Android CI

on:
  push:
    branches:
      - main
      - "release-branch/*"
  pull_request:
    # all PRs on all branches
  workflow_dispatch:
    # so an APK can be built on demand without pushing

jobs:
  build:
    runs-on: ubuntu-latest

    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
      - name: Switch to Java 17 # Note: 17 is pre-installed on ubuntu-latest
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      # Clean should essentially be a no-op, but make sure that it works.
      - name: Clean
        run: make clean

      - name: Format check (ktfmt)
        run: make fmt-check
  
      - name: Run Go tests
        run: make go-test

      - name: Run tests
        run: make test

      # Signing is optional so pull requests and forks — which cannot read
      # secrets — still build and test. Only a signed release APK is worth
      # publishing: an unsigned one will not install, and a debug one is signed
      # with a keystore this runner generates from scratch, so it would differ
      # on every run and could not update an existing install.
      - name: Check for signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HEADLINK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing key configured; building a debug APK and not publishing it."
          fi

      # The secret is read through the environment rather than interpolated into
      # the script: interpolation would break on any shell metacharacter and
      # would put the value in the generated script itself. Whitespace is
      # stripped because the usual way to produce the secret — piping `base64`
      # into the clipboard — wraps its output at 76 columns.
      - name: Decode signing key
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.HEADLINK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HEADLINK_KEYSTORE_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/signing.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"; then
            echo "::error::HEADLINK_KEYSTORE_BASE64 is not valid base64. Re-create it with: base64 -i <keystore>.jks | tr -d '\\n' | gh secret set HEADLINK_KEYSTORE_BASE64"
            exit 1
          fi
          # base64 -d can exit 0 having written nothing, and a keystore is never
          # empty, so an empty file means the secret was not a keystore at all.
          if [ ! -s "$keystore" ]; then
            echo "::error::HEADLINK_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          # Fail here, with a clear message, rather than inside Gradle.
          if ! keytool -list -keystore "$keystore" \
                -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The decoded file is not a keystore, or HEADLINK_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          HEADLINK_KEYSTORE_PATH: ${{ runner.temp }}/signing.jks
          HEADLINK_KEYSTORE_PASSWORD: ${{ secrets.HEADLINK_KEYSTORE_PASSWORD }}
          HEADLINK_KEY_ALIAS: ${{ secrets.HEADLINK_KEY_ALIAS }}
          HEADLINK_KEY_PASSWORD: ${{ secrets.HEADLINK_KEY_PASSWORD }}
        run: make release-apk

      - name: Verify the APK is actually signed
        if: steps.signing.outputs.available == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs headlink-release.apk

      - name: Build debug APK
        if: steps.signing.outputs.available != 'true'
        run: make headlink-debug.apk

      # Retained for a month; these are large builds and keeping every one
      # forever is not free.
      - name: Upload APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: headlink-release-${{ github.sha }}
          path: headlink-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.jks"
