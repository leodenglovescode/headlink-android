name: Android CI

on:
  push:
    branches:
      - main
      - "release-branch/*"
  pull_request:
    # all PRs on all branches
  workflow_dispatch:
    # so an APK can be built on demand without pushing

jobs:
  build:
    runs-on: ubuntu-latest

    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
      - name: Switch to Java 17 # Note: 17 is pre-installed on ubuntu-latest
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      # Clean should essentially be a no-op, but make sure that it works.
      - name: Clean
        run: make clean

      - name: Format check (ktfmt)
        run: make fmt-check
  
      - name: Run Go tests
        run: make go-test

      - name: Build APK
        run: make headlink-debug.apk

      - name: Run tests
        run: make test

      # The APK is the point of this workflow: a build you can install without
      # a local Go, NDK and SDK toolchain. Retained for a month; these are
      # ~170 MB debug builds, so keeping them forever is not free.
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: headlink-debug-${{ github.sha }}
          path: headlink-debug.apk
          retention-days: 30
          if-no-files-found: error
