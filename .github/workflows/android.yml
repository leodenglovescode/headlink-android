name: Android CI

on:
  push:
    branches:
      - main
      - "release-branch/*"
    tags:
      # a tagged build is additionally published to the Releases page
      - "v*"
  pull_request:
    # all PRs on all branches
  workflow_dispatch:
    # so an APK can be built on demand without pushing

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed only to create a Release; everything else in this job reads.
    permissions:
      contents: write

    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
      - name: Switch to Java 17 # Note: 17 is pre-installed on ubuntu-latest
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      # Clean should essentially be a no-op, but make sure that it works.
      - name: Clean
        run: make clean

      - name: Format check (ktfmt)
        run: make fmt-check
  
      - name: Run Go tests
        run: make go-test

      - name: Run tests
        run: make test

      # Signing is optional so pull requests and forks — which cannot read
      # secrets — still build and test. Only a signed release APK is worth
      # publishing: an unsigned one will not install, and a debug one is signed
      # with a keystore this runner generates from scratch, so it would differ
      # on every run and could not update an existing install.
      - name: Check for signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HEADLINK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing key configured; building a debug APK and not publishing it."
          fi

      # The secret is read through the environment rather than interpolated into
      # the script: interpolation would break on any shell metacharacter and
      # would put the value in the generated script itself. Whitespace is
      # stripped because the usual way to produce the secret — piping `base64`
      # into the clipboard — wraps its output at 76 columns.
      - name: Decode signing key
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.HEADLINK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HEADLINK_KEYSTORE_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/signing.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"; then
            echo "::error::HEADLINK_KEYSTORE_BASE64 is not valid base64. Re-create it with: base64 -i <keystore>.jks | tr -d '\\n' | gh secret set HEADLINK_KEYSTORE_BASE64"
            exit 1
          fi
          # base64 -d can exit 0 having written nothing, and a keystore is never
          # empty, so an empty file means the secret was not a keystore at all.
          if [ ! -s "$keystore" ]; then
            echo "::error::HEADLINK_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          # Fail here, with a clear message, rather than inside Gradle.
          if ! keytool -list -keystore "$keystore" \
                -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The decoded file is not a keystore, or HEADLINK_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi

      # Android refuses to install an APK whose versionCode is lower than the
      # installed one, and cannot tell two builds apart when it is equal. The
      # literal in build.gradle only moves when someone runs
      # `make bump-version-code`, which CI does not, so without this every
      # build would claim to be the same version. Stamped in the runner's
      # checkout only and never committed.
      - name: Stamp version
        id: version
        if: steps.signing.outputs.available == 'true'
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"          # a deliberate, hand-cut release
          else
            tag="v0.1.$GITHUB_RUN_NUMBER"   # an ordinary push to main
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Minutes since the epoch, times ten — the same scheme as
          # `make bump-version-code`. Wall-clock time is monotonic, so this can
          # never go backwards between builds. The last digit is reserved for
          # the build variant, and 0 means phone.
          code=$(( $(date +%s) / 60 * 10 ))
          sed -i -E "s/versionCode [0-9]+/versionCode $code/" android/build.gradle
          if ! grep -qE "versionCode $code" android/build.gradle; then
            echo "::error::Failed to stamp versionCode; the literal in android/build.gradle may have changed shape."
            exit 1
          fi
          echo "::notice::Building $tag with versionCode $code"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          HEADLINK_KEYSTORE_PATH: ${{ runner.temp }}/signing.jks
          HEADLINK_KEYSTORE_PASSWORD: ${{ secrets.HEADLINK_KEYSTORE_PASSWORD }}
          HEADLINK_KEY_ALIAS: ${{ secrets.HEADLINK_KEY_ALIAS }}
          HEADLINK_KEY_PASSWORD: ${{ secrets.HEADLINK_KEY_PASSWORD }}
        run: make release-apk

      - name: Verify the APK is actually signed
        if: steps.signing.outputs.available == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs headlink-release.apk

      - name: Build debug APK
        if: steps.signing.outputs.available != 'true'
        run: make headlink-debug.apk

      # Retained for a month; these are large builds and keeping every one
      # forever is not free.
      - name: Upload APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: headlink-release-${{ github.sha }}
          path: headlink-release.apk
          retention-days: 30
          if-no-files-found: error

      # A tagged build also becomes a Release, so the APK gets a permanent
      # public URL a phone browser can install from directly. Workflow
      # artifacts cannot serve that purpose: they are zipped, they expire, and
      # downloading one requires a GitHub login.
      #
      # LICENSE ships next to the APK because BSD-3-Clause requires binary
      # redistributions to reproduce the copyright notice and disclaimer in the
      # materials provided with the distribution. The notes carry the same
      # notice inline, and the "not an official Tailscale application" line is
      # the no-endorsement condition.
      - name: Publish release
        if: steps.signing.outputs.available == 'true' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          # Version the asset so downloads are self-identifying once saved.
          cp headlink-release.apk "headlink-$TAG.apk"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Signed release APK for \`$TAG\`. Install it directly on the device;
          it is signed with the Headlink release key, so it updates an existing
          install in place.

          ---

          Headlink is an independent fork of the open-source
          [Tailscale Android client](https://github.com/tailscale/tailscale-android),
          adapted as a client for private Headscale deployments.
          **It is not an official Tailscale application and is not affiliated
          with or endorsed by Tailscale Inc.**

          Portions Copyright (c) 2020 Tailscale & AUTHORS. All rights reserved.
          Used under the BSD-3-Clause licence, reproduced in the \`LICENSE\`
          file attached to this release. This software is provided "as is",
          without warranty of any kind.
          EOF
          # gh creates the tag itself from --target, so no tag has to be
          # managed by hand. A tag created through the API with GITHUB_TOKEN
          # deliberately does not trigger another workflow run, so this cannot
          # loop. Re-running a build replaces the assets instead of failing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "headlink-$TAG.apk" LICENSE --clobber
          else
            gh release create "$TAG" \
              --target "$SHA" \
              --title "Headlink $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "headlink-$TAG.apk" \
              LICENSE
          fi

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.jks"
