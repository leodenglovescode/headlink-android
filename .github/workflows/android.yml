name: Android CI

on:
  push:
    branches:
      - main
      - "release-branch/*"
  pull_request:
    # all PRs on all branches
  workflow_dispatch:
    # so an APK can be built on demand without pushing

jobs:
  build:
    runs-on: ubuntu-latest

    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
      - name: Switch to Java 17 # Note: 17 is pre-installed on ubuntu-latest
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      # Clean should essentially be a no-op, but make sure that it works.
      - name: Clean
        run: make clean

      - name: Format check (ktfmt)
        run: make fmt-check
  
      - name: Run Go tests
        run: make go-test

      - name: Run tests
        run: make test

      # Signing is optional so pull requests and forks — which cannot read
      # secrets — still build and test. Only a signed release APK is worth
      # publishing: an unsigned one will not install, and a debug one is signed
      # with a keystore this runner generates from scratch, so it would differ
      # on every run and could not update an existing install.
      - name: Check for signing key
        id: signing
        run: |
          if [ -n "${{ secrets.HEADLINK_KEYSTORE_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing key configured; building a debug APK and not publishing it."
          fi

      - name: Decode signing key
        if: steps.signing.outputs.available == 'true'
        run: echo "${{ secrets.HEADLINK_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/headlink.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          HEADLINK_KEYSTORE_PATH: ${{ runner.temp }}/headlink.jks
          HEADLINK_KEYSTORE_PASSWORD: ${{ secrets.HEADLINK_KEYSTORE_PASSWORD }}
          HEADLINK_KEY_ALIAS: ${{ secrets.HEADLINK_KEY_ALIAS }}
          HEADLINK_KEY_PASSWORD: ${{ secrets.HEADLINK_KEY_PASSWORD }}
        run: make release-apk

      - name: Verify the APK is actually signed
        if: steps.signing.outputs.available == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs headlink-release.apk

      - name: Build debug APK
        if: steps.signing.outputs.available != 'true'
        run: make headlink-debug.apk

      # Retained for a month; these are large builds and keeping every one
      # forever is not free.
      - name: Upload APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: headlink-release-${{ github.sha }}
          path: headlink-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/headlink.jks"
